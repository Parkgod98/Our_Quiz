name: Core E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Rebuild local database from migrations
        run: supabase db reset

      - name: Export local Supabase connection
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          echo "E2E_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "E2E_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"

      - name: Run core user flow
        run: npm run test:e2e

      - name: Show Supabase status on failure
        if: failure()
        run: supabase status || true

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
