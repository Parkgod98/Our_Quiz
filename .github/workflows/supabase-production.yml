name: Supabase Production Migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "SUPABASE_ACCESS_TOKEN secret is missing" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "SUPABASE_PROJECT_REF secret is missing" && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo "SUPABASE_DB_PASSWORD secret is missing" && exit 1)

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Reconcile manually applied initial migration
        shell: bash
        run: |
          if ! supabase migration list --linked -p "$SUPABASE_DB_PASSWORD" | grep -E "202609050001[[:space:]]*\|[[:space:]]*202609050001" >/dev/null; then
            echo "Initial schema exists from the original manual SQL setup; marking its migration history as applied."
            supabase migration repair 202609050001 --status applied --linked -p "$SUPABASE_DB_PASSWORD"
          fi

      - name: Preview pending migrations
        run: supabase db push --linked --dry-run -p "$SUPABASE_DB_PASSWORD"

      - name: Apply pending migrations
        run: supabase db push --linked -p "$SUPABASE_DB_PASSWORD"
